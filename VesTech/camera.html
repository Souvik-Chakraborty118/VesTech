<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BinGo | AI Scanner</title>
    <link rel="stylesheet" href="camera.css">
</head>
<body>
    <nav class="navbar"><div class="logo">BinGo Scanner</div><a href="profile_edit.html">Profile</a></nav>
    <div class="scanner-container">
        <video id="webcam" autoplay playsinline></video>
        <button id="captureBtn" class="btn-primary">Scan Waste</button>
        <canvas id="canvas" style="display:none;"></canvas>
        <div id="resultPanel">
            <h3>Verification Result</h3>
            <p>Category: <span id="category">-</span></p>
            <p>Confidence: <span id="confidence">-</span>%</p>
            <p>System Action: <span id="action">-</span></p>
        </div>
    </div>
    <script src="camera.js"></script>
</body>
</html>
