<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BinGo | Register</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2>Join BinGo</h2>
            <p>Create your account</p>
        </div>
        <div class="content-area">
            <form id="registerForm">
                <input type="text" id="fullName" class="input-field" required placeholder="Full Name">
                <input type="email" id="email" class="input-field" required placeholder="Hospital Email">
                <input type="password" id="password" class="input-field" required placeholder="Password">
                <select id="role" class="input-field" required>
                    <option value="" disabled selected>Select Role...</option>
                    <option value="DOCTOR_NURSE">Doctor/Nurse</option>
                    <option value="WASTE_STAFF">Waste Mgmt Staff</option>
                    <option value="TECHNICIAN">Technician</option>
                    <option value="ADMIN">Admin</option>
                </select>
                <button type="submit" class="btn-primary">CREATE ACCOUNT</button>
            </form>
            <div class="switch-auth">
                Already signed up? <a href="login.html">Login</a>
            </div>
            <p class="branding">© Developed by Team VesTech</p>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
