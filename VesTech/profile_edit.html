<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | VesTech BinGo</title>
    <link rel="stylesheet" href="profile_edit.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand-section">
            <img src="Vestech_logo.jpeg" alt="VesTech Logo" class="brand-logo">
            <div class="brand-text">
                <h2>VesTech <span>BinGo</span></h2>
                <p>AI Waste Segregation</p>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Command Center</a>
            <a href="#">Technology</a>
        </div>
        <div class="auth-group">
            <a href="login.html" class="text-link">Login</a>
            <a href="register.html" class="btn-teal">Register Portal</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="auth-card">
            <h1>Edit Profile</h1>
            <p class="subtitle">Keep your operator credentials current</p>
            
            <form action="#">
                <div class="input-group">
                    <label>Update Name</label>
                    <span class="icon">👤</span>
                    <input type="text" placeholder="Dr. Emily Okonkwo">
                </div>
                <div class="input-group">
                    <label>New Password</label>
                    <span class="icon">❌</span>
                    <input type="password" placeholder="Leave blank to keep current">
                </div>
                
                <button type="submit" class="btn-teal btn-full" style="margin-bottom: 10px;">Save Changes</button>
                <a href="dashboard.html" class="btn-secondary btn-full" style="display:inline-block; text-decoration:none;">Go Back</a>
            </form>
        </div>
    </div>

    <footer>
        <h3>BinGo <span>Platform</span></h3>
        <p>Next-generation automated AI waste classification and routing.</p>
        <p class="copyright">© Developed by Team VesTech.</p>
    </footer>
</body>
</html>
