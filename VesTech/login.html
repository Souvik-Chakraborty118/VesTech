<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | BinGo</title>
    <link rel="stylesheet" href="login.css">
    <!-- FontAwesome for the Eye Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand-section">
            <img src="Vestech_logo.jpeg" alt="VesTech Logo" class="brand-logo" style="border-radius: 8px;">
            <div class="brand-text">
                <h2>BinGo</h2>
                <p>by VesTech</p>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Command Center</a>
            <a href="technology.html">Technology</a>
        </div>
        <div class="auth-group">
            <a href="login.html" class="btn-teal">Login</a>
            <a href="register.html" class="text-link">Register</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to the BinGo Portal</p>
            
            <form id="authForm">
                <div class="input-group">
                    <label>Email</label>
                    <span class="icon">✉️</span>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>
                
                <!-- PASSWORD FIELD WITH INLINE EYE ICON FIX -->
                <div class="input-group" style="position: relative;">
                    <label>Password</label>
                    <span class="icon">🔒</span>
                    <input type="password" id="loginPass" placeholder="••••••••••••" required style="padding-right: 40px;">
                    <i class="fa-solid fa-eye toggle-password" id="togglePassword" style="position: absolute; right: 15px; top: 38px; cursor: pointer; color: #94a3b8;"></i>
                </div>
                
                <div class="input-group">
                    <label>Your Role</label>
                    <span class="icon">🩺</span>
                    <select id="loginRole" required>
                        <option value="" disabled selected>Select your clinical rank...</option>
                        <option value="Doctor">Doctor</option>
                        <option value="Nurse">Nurse</option>
                        <option value="Waste Management Staff">Waste Management Staff</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-teal btn-full" id="loginSubmitBtn">Login</button>
            </form>
            
            <a href="register.html" class="auth-link">New here? <span>Register Account</span></a>
        </div>
    </div>

    <footer>
        <h3>BinGo</h3>
        <p>Next-generation automated AI waste classification and routing.</p>
        <p class="copyright">© Developed by Team VesTech. All medical standards compliant.</p>
    </footer>

    <script src="login.js"></script>
</body>
</html>
