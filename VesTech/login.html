<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | VesTech BinGo</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand-section">
            <img src="Vestech_logo.jpeg" alt="VesTech Logo" class="brand-logo">
            <div class="brand-text">
                <h2>VesTech <span>BinGo</span></h2>
                <p>BinGo by VesTech</p>
            </div>
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Command Center</a>
            <a href="#">Technology</a>
        </div>
        <div class="auth-group">
            <a href="login.html" class="text-link" style="color: #0d9488;">Login</a>
            <a href="register.html" class="btn-teal">Register Portal</a>
        </div>
    </nav>

    <div class="page-container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to the BinGo Portal</p>
            
            <form id="authForm" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Hospital Email</label>
                    <span class="icon">✉️</span>
                    <input type="email" placeholder="doctor@hospital.org">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <span class="icon">🔒</span>
                    <input type="password" placeholder="••••••••••••">
                </div>
                <div class="input-group">
                    <label>Your Role</label>
                    <span class="icon">🩺</span>
                    <select>
                        <option>Doctor / Nurse</option>
                        <option>Sanitation Staff</option>
                    </select>
                </div>
                <button type="submit" class="btn-teal btn-full">Login</button>
            </form>
            <a href="register.html" class="auth-link">New here? <span>Register Account</span></a>
        </div>
    </div>

    <footer>
        <h3>BinGo <span>Platform</span></h3>
        <p>Next-generation automated AI waste classification and routing.</p>
        <p class="copyright">© Developed by Team VesTech.</p>
    </footer>
    <script>
        function handleAuth(event) {
            event.preventDefault();
            localStorage.setItem('isAuthenticated', 'true');
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
